name: lint

on:
  push:
    branches: [master, 'chore/**', 'feature/**', 'bugfix/**']
  pull_request:

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate manifest and background script paths
        run: python3 maintainer/check-manifest.py

  eslint-rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: maintainer/eslint-rules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: maintainer/eslint-rules/package-lock.json
      - name: Install eslint-rules dependencies
        run: npm ci
      - name: Require eslint package loads
        run: node -e "require('eslint'); require('./index.js'); console.log('eslint-rules ok')"
